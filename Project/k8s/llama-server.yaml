# Local model backend: llama.cpp server + Qwen2.5-1.5B (only used in local mode)
#
# The model file (1.1 GB) is not in any image: an init container downloads it
# once into a persistent volume, and later pod restarts reuse it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: tokenwise
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: tokenwise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      initContainers:
        - name: download-model
          image: curlimages/curl:8.11.1
          command: ["sh", "-c"]
          args:
            - |
              if [ -f /models/$MODEL_FILE ]; then echo "model already present"; exit 0; fi
              curl -fsSL -o /models/$MODEL_FILE.part "$MODEL_URL" && mv /models/$MODEL_FILE.part /models/$MODEL_FILE
          env:
            - name: MODEL_FILE
              value: qwen2.5-1.5b-instruct-q4_k_m.gguf
            - name: MODEL_URL
              value: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          # -t 4: as many threads as the CPU limit, otherwise llama.cpp starts one per node core
          # and the pod gets throttled (measured: 10-12 s per answer instead of ~2 s)
          args: ["-m", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "4096", "-t", "4"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 1500Mi
            limits:
              cpu: "4"
              memory: 2500Mi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
---
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: tokenwise
spec:
  selector:
    app: llama-server
  ports:
    - port: 80
      targetPort: 8080
